name: InterviewIQ CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-test:
    name: Backend Lint & Unit Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: interviewiq
          POSTGRES_PASSWORD: interviewiq_dev_pass
          POSTGRES_DB: interviewiq_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "email-validator>=2.1.0" .[dev]

      - name: Lint Code with Ruff
        run: |
          ruff check apps/api workers

      - name: Run Pytest
        env:
          DATABASE_URL: postgresql+asyncpg://interviewiq:interviewiq_dev_pass@localhost:5432/interviewiq_db
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test
          SECRET_KEY: ci_secret_key_testing_12345
        run: |
          pytest

  frontend-check:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/web/package.json

      - name: Install Dependencies
        run: |
          cd apps/web
          npm ci || npm install

      - name: Build Web Application
        run: |
          cd apps/web
          npm run build --if-present
