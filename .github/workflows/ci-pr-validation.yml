name: PR Security & Quality Validation Pipeline

on:
  pull_request:
    branches: [ main, develop, staging ]

jobs:
  security-and-secret-scan:
    name: Secret Scanning & Security Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Scan Detection
        uses: trufflesecurity/trufflehog-actions-scan@v3.88.1
        continue-on-error: true

  iac-validation:
    name: Terraform IaC Format & Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive infrastructure/terraform

      - name: Init & Validate Staging IaC
        run: |
          cd infrastructure/terraform/environments/staging
          terraform init -backend=false
          terraform validate

      - name: Init & Validate Production IaC
        run: |
          cd infrastructure/terraform/environments/production
          terraform init -backend=false
          terraform validate

  backend-quality:
    name: Backend Test Suite & Migration Integrity
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: interviewiq
          POSTGRES_PASSWORD: interviewiq_pass
          POSTGRES_DB: interviewiq_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic pydantic-settings sqlalchemy asyncpg alembic redis google-genai httpx python-multipart passlib[bcrypt] python-jose[cryptography] pgvector pytest pytest-asyncio reportlab

      - name: Migration Downgrade & Upgrade Validation
        env:
          DATABASE_URL: postgresql+asyncpg://interviewiq:interviewiq_pass@localhost:5433/interviewiq_db
        run: |
          PYTHONPATH=. python3 -m alembic -c apps/api/alembic.ini downgrade base
          PYTHONPATH=. python3 -m alembic -c apps/api/alembic.ini upgrade head

      - name: Run Full Pytest Suite
        env:
          DATABASE_URL: postgresql+asyncpg://interviewiq:interviewiq_pass@localhost:5433/interviewiq_db
          ENVIRONMENT: test
        run: |
          PYTHONPATH=. python3 -m pytest apps/api/app/modules/*/tests/*.py workers/tests/*.py tests/*/*.py -v

  frontend-quality:
    name: Frontend Lint, Typecheck & Production Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/web/package.json

      - name: Install Dependencies
        run: |
          cd apps/web
          npm ci || npm install

      - name: Production Web Build
        run: |
          cd apps/web
          npm run build

  container-validation:
    name: Dockerfile Production Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker Compose Validation
        run: docker compose config --quiet

      - name: Build API Container Image
        run: docker build -f infrastructure/docker/Dockerfile.api -t interviewiq-api:ci .

      - name: Build Worker Container Image
        run: docker build -f infrastructure/docker/Dockerfile.worker -t interviewiq-worker:ci .

      - name: Build Web Container Image
        run: docker build -f infrastructure/docker/Dockerfile.web -t interviewiq-web:ci .
